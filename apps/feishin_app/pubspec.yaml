name: feishin_app
description: Android remote for Feishin desktop.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  core:
    path: ../../packages/core
  dynamic_color: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.1.0
  freezed_annotation: ^3.1.0
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3

dev_dependencies:
  build_runner: ^2.4.15
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5

flutter:
  uses-material-design: true
  assets:
    - assets/theme/theme_config.json
